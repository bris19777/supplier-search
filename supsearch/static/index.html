<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>חיפוש ספקים</title>
<style>
  :root {
    --bg: #f4f6f9; --panel: #fff; --ink: #1d2433; --muted: #667085; --line: #e3e7ee;
    --accent: #1f5eff; --accent-soft: #e8efff; --ok: #12805c; --ok-soft: #e3f6ee;
    --bad: #b42318; --bad-soft: #fdecea; --warn: #9a6700; --warn-soft: #fff4d6;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--ink); font-size: 14px; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 16px; position: sticky; top: 0; z-index: 5; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; max-width: 1500px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 0 12px; white-space: nowrap; }
  #q { flex: 1 1 320px; min-width: 0; font-size: 16px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; }
  button, select { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .6; cursor: default; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; }
  .seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  #sites { display: flex; gap: 6px; flex-wrap: wrap; max-width: 1500px; margin: 10px auto 0; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: 13px; }
  .chip.ok { border-color: #b7e4cf; background: var(--ok-soft); }
  .chip.err { border-color: #f5c2bd; background: var(--bad-soft); }
  .chip.login { border-color: #f1d48a; background: var(--warn-soft); }
  .chip.off { opacity: .5; }
  .chip button { padding: 1px 8px; font-size: 12px; }
  main { display: grid; grid-template-columns: 270px 1fr; gap: 16px; max-width: 1500px; margin: 16px auto; padding: 0 16px; }
  aside { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; align-self: start; position: sticky; top: 120px; max-height: calc(100vh - 140px); overflow: auto; }
  aside h3 { font-size: 13px; margin: 14px 0 6px; color: var(--muted); }
  aside h3:first-child { margin-top: 0; }
  aside label { display: flex; align-items: center; gap: 6px; padding: 2px 0; cursor: pointer; }
  aside label .n { margin-inline-start: auto; color: var(--muted); font-size: 12px; }
  aside input[type=number], aside input[type=text] { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  .row2 { display: flex; gap: 6px; }
  .facet .more { color: var(--accent); background: none; border: 0; padding: 2px 0; font-size: 13px; }
  #summary { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; color: var(--muted); }
  #summary .grow { flex: 1; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .item { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--line); align-items: center; }
  .item:last-child { border-bottom: 0; }
  .item img, .head img, .ph { width: 64px; height: 64px; object-fit: contain; border-radius: 6px; background: #fafbfc; }
  .title { font-weight: 600; color: var(--ink); text-decoration: none; }
  .title:hover { color: var(--accent); }
  .meta { color: var(--muted); font-size: 12px; margin-top: 3px; display: flex; gap: 10px; flex-wrap: wrap; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--accent-soft); color: var(--accent); }
  .in { background: var(--ok-soft); color: var(--ok); }
  .out { background: var(--bad-soft); color: var(--bad); }
  .unk { background: #f0f2f5; color: var(--muted); }
  .price { text-align: left; white-space: nowrap; }
  .price b { font-size: 18px; }
  .price small { display: block; color: var(--muted); font-size: 12px; }
  .group { padding: 12px; margin-bottom: 12px; }
  .group .head { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; }
  .offers { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  .offers td { padding: 6px 8px; border-top: 1px solid var(--line); }
  .offers tr.best td { background: var(--ok-soft); }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #filtersToggle { display: none; }
  .star { border: 0; background: none; padding: 0 2px; font-size: 16px; line-height: 1; color: #c9a227; cursor: pointer; }
  .favbar { display: inline-flex; gap: 6px; margin-inline-end: 6px; }
  .favbar button { padding: 3px 10px; font-size: 13px; border-radius: 999px; }
  .qbtn { margin-top: 6px; padding: 3px 10px; font-size: 12px; }
  dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(520px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(20, 25, 40, .35); }
  dialog form { padding: 18px; display: grid; gap: 10px; }
  dialog h3 { margin: 0; font-size: 16px; }
  dialog .ptitle { color: var(--muted); font-size: 13px; }
  dialog label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  dialog input, dialog textarea { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); width: 100%; min-width: 0; }
  dialog input[type=checkbox] { width: auto; }
  dialog .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  dialog .totals { background: #fafbfc; border-radius: 8px; padding: 8px 10px; font-size: 13px; }
  dialog .actions { display: flex; gap: 8px; justify-content: flex-start; }
  dialog .cost { font-size: 12px; color: var(--muted); }
  .userbar { display: inline-flex; gap: 10px; align-items: center; margin-inline-start: auto; color: var(--muted); }
  .userbar a, .userbar button.link { color: var(--accent); text-decoration: none; background: none; border: 0; padding: 0; font: inherit; cursor: pointer; }
  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; }
    aside { position: static; max-height: none; display: none; }
    aside.open { display: block; }
    #filtersToggle { display: inline-block; }
    .item { grid-template-columns: 48px 1fr; }
    .item img, .head img, .ph { width: 48px; height: 48px; }
    .group .head { grid-template-columns: 48px 1fr; }
    .group .head .price { grid-column: 2; text-align: right; }
    .offers td:nth-child(2) { display: none; }
    .item .price { grid-column: 2; text-align: right; }
  }
</style>
</head>
<body>
<header>
  <form class="bar" id="form">
    <h1>חיפוש ספקים</h1>
    <input id="q" type="search" placeholder="שם מוצר, דגם או מק&quot;ט יצרן…" autocomplete="off" autofocus>
    <button class="primary" type="submit" id="go">חפש</button>
    <select id="source" title="אינדקס: תשובה מיידית מהמוצרים שנאספו (עד כמה שעות אחורה). חי: חיפוש באתרי הספקים עכשיו">
      <option value="auto">מקור: אינדקס (מהיר)</option>
      <option value="live">מקור: חי מהאתרים</option>
    </select>
    <label title="מתעלם מהאינדקס ומהזיכרון הזמני ומושך מחדש מכל האתרים"><input type="checkbox" id="refresh"> רענון מלא</label>
    <label title="למחשבים ומסכים שבשמם חסר מפרט: פותח את דף המוצר וקורא ממנו מעבד, זיכרון, אחסון ומסך. איטי יותר"><input type="checkbox" id="deep"> חיפוש מעמיק</label>
    <span class="seg" id="basis"><button type="button" data-v="inc" class="on">כולל מע"מ</button><button type="button" data-v="ex">לפני מע"מ</button></span>
    <span class="seg" id="view"><button type="button" data-v="list" class="on">רשימה</button><button type="button" data-v="compare">השוואה</button></span>
    <button type="button" id="filtersToggle">סינון</button>
    <span id="egress" class="chip" hidden></span>
    <span id="userbar" class="userbar"></span>
  </form>
  <div id="sites"></div>
</header>

<main>
  <aside id="filters">
    <h3>מחיר (₪)</h3>
    <div class="row2"><input type="number" id="pmin" placeholder="מ-" min="0"><input type="number" id="pmax" placeholder="עד" min="0"></div>
    <h3>אפשרויות</h3>
    <label title="מוצרים שאזלו לא מוצגים אף פעם. הסימון מסתיר גם מוצרים שהספק לא מציג להם מלאי"><input type="checkbox" id="instock"> רק מלאי מאושר</label>
    <label><input type="checkbox" id="hasprice"> רק מוצרים עם מחיר</label>
    <label><input type="checkbox" id="relevant"> רק תוצאות שמכילות את כל מילות החיפוש</label>
    <h3>חייב להכיל</h3>
    <input type="text" id="include" placeholder="למשל: nvme">
    <h3>לא להכיל</h3>
    <input type="text" id="exclude" placeholder="למשל: מארז">
    <div id="facets"></div>
    <p><button type="button" id="clear">ניקוי כל הסינונים</button></p>
  </aside>
  <section>
    <div id="summary"><span class="grow" id="count">הקלד מוצר לחיפוש בכל הספקים במקביל.</span>
      <select id="sort">
        <option value="relevance">מיון: רלוונטיות</option>
        <option value="price_asc">מחיר: מהזול ליקר</option>
        <option value="price_desc">מחיר: מהיקר לזול</option>
        <optgroup label="לפי מפרט">
          <option value="cpu_desc">מעבד: מהחזק לחלש</option>
          <option value="cpu_asc">מעבד: מהחלש לחזק</option>
          <option value="screen_desc">מסך: מהגדול לקטן</option>
          <option value="screen_asc">מסך: מהקטן לגדול</option>
          <option value="ram_desc">זיכרון RAM: מהגדול לקטן</option>
          <option value="ram_asc">זיכרון RAM: מהקטן לגדול</option>
          <option value="storage_desc">נפח אחסון: מהגדול לקטן</option>
          <option value="storage_asc">נפח אחסון: מהקטן לגדול</option>
          <option value="gpu_desc">כרטיס מסך: מהחזק לחלש</option>
          <option value="gpu_asc">כרטיס מסך: מהחלש לחזק</option>
        </optgroup>
        <option value="site">לפי ספק</option>
        <option value="title">לפי שם</option>
      </select>
    </div>
    <div id="results"></div>
  </section>
</main>

<dialog id="quoteDlg">
  <form method="dialog" id="quoteForm">
    <h3>הצעת מחיר</h3>
    <div class="ptitle" id="qTitle"></div>
    <label>לקוח <input id="qCustomer" maxlength="120" placeholder="שם הלקוח או החברה"></label>
    <label>פרטי קשר <input id="qContact" maxlength="200" placeholder="טלפון / מייל (לא חובה)"></label>
    <div class="grid3">
      <label>כמות <input id="qQty" type="number" min="1" step="1" value="1"></label>
      <label>תוספת % <input id="qMarkup" type="number" min="0" step="0.5"></label>
      <label>מחיר ליחידה (לפני מע"מ) <input id="qPrice" type="number" min="0" step="0.01" required></label>
    </div>
    <div class="cost" id="qCost"></div>
    <label>הערות <textarea id="qNotes" rows="2" maxlength="1000" placeholder="למשל: כולל התקנה, אחריות 3 שנים"></textarea></label>
    <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="qImage" checked> להציג תמונת מוצר</label>
    <div class="totals" id="qTotals"></div>
    <div class="actions">
      <button type="submit" class="primary" id="qGo" value="go">הורדת PDF</button>
      <button type="button" id="qCancel">ביטול</button>
    </div>
    <div class="cost">בהצעה לא מופיעים שם הספק ומחיר העלות.</div>
  </form>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const state = { view: "list", basis: "inc", facets: {}, sites: [], disabled: new Set(), expanded: new Set(), lastQuery: "" };
const nf = new Intl.NumberFormat("he-IL", { maximumFractionDigits: 2 });

// every API call: an expired or missing session goes back to the login page
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", ...(opts.headers || {}) } });
  if (r.status === 401) { location.href = "login"; throw new Error("יש להתחבר"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || r.statusText);
  return j;
}

async function loadMe() {
  const me = await api("api/me");
  state.me = me;
  state.favorites = new Set(me.favorites || []);
  const bar = $("#userbar");
  if (me.open) {
    bar.innerHTML = `<a href="admin" title="עדיין אין משתמשים - המערכת פתוחה לכולם">הגדרת משתמשים</a>`;
    return;
  }
  bar.innerHTML = `<span>${esc(me.username)}</span>`
    + (me.role === "admin" ? `<a href="admin">ניהול</a>` : "")
    + `<button type="button" class="link" id="chpass">שינוי סיסמה</button>`
    + `<button type="button" class="link" id="logout">יציאה</button>`;
  $("#logout").onclick = async () => { await fetch("api/logout", { method: "POST" }); location.href = "login"; };
  $("#chpass").onclick = async () => {
    const current = prompt("הסיסמה הנוכחית:"); if (!current) return;
    const next = prompt("סיסמה חדשה (לפחות 6 תווים):"); if (!next) return;
    try { await api("api/me/password", { method: "POST", body: JSON.stringify({ current, new: next }) });
          alert("הסיסמה הוחלפה. יש להתחבר מחדש."); location.href = "login"; }
    catch (e) { alert(e.message); }
  };
}

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function ago(sec) {
  if (sec < 3600) return `לפני ${Math.max(1, Math.round(sec / 60))} דק'`;
  if (sec < 86400) return `לפני ${Math.round(sec / 3600)} שע'`;
  return `לפני ${Math.round(sec / 86400)} ימים`;
}
function money(v) { return v == null ? "—" : "₪" + nf.format(v); }
function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : "#"; }

function loadPrefs() {
  try {
    const p = JSON.parse(localStorage.getItem("supsearch") || "{}");
    if (p.basis) state.basis = p.basis;
    if (p.source) $("#source").value = p.source;
    if (p.view) state.view = p.view;
    (p.disabled || []).forEach(id => state.disabled.add(id));
  } catch (e) {}
}
function savePrefs() {
  try { localStorage.setItem("supsearch", JSON.stringify({ basis: state.basis, view: state.view, source: $("#source").value, disabled: [...state.disabled] })); } catch (e) {}
}

function segment(id, key) {
  const el = $(id);
  el.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === state[key]));
  el.addEventListener("click", e => {
    const v = e.target.dataset.v; if (!v) return;
    state[key] = v; savePrefs();
    el.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
    run(false);
  });
}

async function loadSites() {
  state.sites = await api("api/sites");
  renderSites(null);
}

function renderSites(results) {
  const byId = Object.fromEntries((results || []).map(r => [r.site, r]));
  const favs = state.favorites || new Set();
  const canFav = state.me && !state.me.open;
  const ordered = [...state.sites].sort((a, b) => (favs.has(b.id) - favs.has(a.id)) || (b.enabled - a.enabled));
  const picks = favs.size ? `<span class="favbar"><button type="button" data-pick="fav">★ רק מועדפים</button><button type="button" data-pick="all">כל הספקים</button></span>` : "";
  $("#sites").innerHTML = picks + ordered.map(s => {
    if (!s.enabled) {
      return `<span class="chip off" title="${esc(s.notes || "")}">${esc(s.name)} · טרם הוגדר${s.fetch === "browser" && s.can_open_window ? ` <button type="button" data-login="${esc(s.id)}" title="פותח את האתר בחלון גלוי ושומר כל דף שנפתח, כדי להגדיר את האתר">פתח והקלט</button>` : ""}</span>`;
    }
    const r = byId[s.id];
    const off = state.disabled.has(s.id);
    let cls = "chip" + (off ? " off" : "");
    let info = "";
    if (r && !off) {
      if (r.needs_login) { cls += " login"; info = `${r.count} · לא מחובר, בלי מחירים`; }
      else if (!r.ok || r.error) { cls += " err"; info = "שגיאה"; }
      else if (r.from_index) { cls += " ok"; info = `${r.count} · אינדקס${r.count ? " · " + ago(r.index_age) : ""}${r.deep_filled ? ` · מפרט ל-${r.deep_filled}` : ""}`; }
      else { cls += " ok"; info = `${r.count} · ${r.elapsed} שנ'${r.cached ? " · זיכרון" : ""}${r.deep_filled ? ` · מפרט ל-${r.deep_filled}` : ""}`; }
    }
    const title = esc((r && r.error) || s.notes || "");
    const loginBtn = s.fetch === "browser" && s.can_open_window ? `<button type="button" data-login="${esc(s.id)}" title="פתיחת חלון דפדפן במחשב השרת להתחברות ידנית">התחברות</button>` : "";
    const star = canFav ? `<button type="button" class="star" data-fav="${esc(s.id)}" title="${favs.has(s.id) ? "הסרה מהמועדפים" : "הוספה לספקים המועדפים שלי"}">${favs.has(s.id) ? "★" : "☆"}</button>` : "";
    return `<span class="${cls}" title="${title}">${star}<label><input type="checkbox" data-site="${esc(s.id)}" ${off ? "" : "checked"}> ${esc(s.name)}</label>${info ? `<span>${esc(info)}</span>` : ""}${loginBtn}</span>`;
  }).join("");
}

$("#sites").addEventListener("change", e => {
  const id = e.target.dataset.site; if (!id) return;
  e.target.checked ? state.disabled.delete(id) : state.disabled.add(id);
  savePrefs(); run(false);
});
function pickFavorites() {
  state.disabled = new Set(state.sites.filter(s => !state.favorites.has(s.id)).map(s => s.id));
}
$("#sites").addEventListener("click", async e => {
  const fav = e.target.dataset.fav, pick = e.target.dataset.pick;
  if (fav) {
    const next = new Set(state.favorites);
    next.has(fav) ? next.delete(fav) : next.add(fav);
    try {
      const j = await api("api/me/favorites", { method: "PUT", body: JSON.stringify({ sites: [...next] }) });
      state.favorites = new Set(j.favorites);
    } catch (ex) { alert(ex.message); }
    renderSites(state.lastSites);
    return;
  }
  if (pick) {
    pick === "fav" ? pickFavorites() : (state.disabled = new Set());
    savePrefs(); renderSites(state.lastSites); run(false);
    return;
  }
  const id = e.target.dataset.login; if (!id) return;
  try {
    const j = await api(`api/sites/${encodeURIComponent(id)}/login-window`, { method: "POST" });
    alert(j.message);
  } catch (e) { alert(e.message); }
});

function request(refresh) {
  const num = (id) => { const v = $(id).value.trim(); return v === "" ? null : Number(v); };
  return {
    query: $("#q").value.trim(),
    sites: state.sites.filter(s => s.enabled && !state.disabled.has(s.id)).map(s => s.id),
    refresh, view: state.view, facets: state.facets,
    price_min: num("#pmin"), price_max: num("#pmax"),
    in_stock: $("#instock").checked, has_price: $("#hasprice").checked,
    include: $("#include").value, exclude: $("#exclude").value,
    min_relevance: $("#relevant").checked ? 1 : 0,
    basis: state.basis, sort: $("#sort").value, deep: $("#deep").checked, source: $("#source").value,
  };
}

let seq = 0;
async function run(refresh) {
  const body = request(refresh);
  if (!body.query) return;
  if (!body.sites.length) { $("#results").innerHTML = `<div class="card empty">לא נבחר אף ספק.</div>`; return; }
  const my = ++seq;
  const isNew = body.query !== state.lastQuery || refresh;
  $("#go").disabled = true;
  $("#count").innerHTML = `<span class="spinner"></span> ${isNew ? "מחפש בכל הספקים…" : body.deep ? "קורא מפרט מדפי המוצרים…" : "מסנן…"}`;
  try {
    const j = await api("api/search", { method: "POST", body: JSON.stringify(body) });
    if (my !== seq) return;
    state.lastQuery = body.query;
    history.replaceState(null, "", "#q=" + encodeURIComponent(body.query));
    render(j);
  } catch (e) {
    if (my === seq) $("#count").textContent = "שגיאה: " + e.message;
  } finally {
    if (my === seq) { $("#go").disabled = false; $("#refresh").checked = false; }
  }
}

function priceBlock(p) {
  const main = state.basis === "ex" ? p.price_ex_vat : p.price_inc_vat;
  const other = state.basis === "ex" ? p.price_inc_vat : p.price_ex_vat;
  const orig = p.currency && p.currency !== "ILS" && p.price != null ? `<small>במקור: ${esc(p.currency)} ${nf.format(p.price)}</small>` : "";
  return `<b>${money(main)}</b>${other != null ? `<small>${state.basis === "ex" ? "כולל" : "לפני"} מע"מ: ${money(other)}</small>` : ""}${orig}`;
}
function stockTag(p) {
  if (p.in_stock === true) return `<span class="tag in">במלאי</span>`;
  if (p.in_stock === false) return `<span class="tag out">${esc(/^\d*$/.test(p.stock_text || "") ? "לא במלאי" : p.stock_text)}</span>`;
  return `<span class="tag unk">מלאי לא ידוע</span>`;
}
function quoteBtn(p) {
  state.quoteItems.push(p);
  return `<button type="button" class="qbtn" data-quote="${state.quoteItems.length - 1}" title="הפקת הצעת מחיר ללקוח (PDF)">הצעת מחיר</button>`;
}
function img(src) { return src ? `<img src="${esc(safeUrl(src))}" loading="lazy" alt="" referrerpolicy="no-referrer">` : `<div class="ph"></div>`; }

function render(j) {
  state.lastSites = j.sites;
  state.quoteItems = [];
  renderSites(j.sites);
  const failed = j.sites.filter(s => s.error && !s.needs_login).length;
  const guests = j.sites.filter(s => s.needs_login).length;
  $("#count").textContent = `${j.matched} מתוך ${j.total} תוצאות מ-${j.sites.length} ספקים`
    + (guests ? ` · ${guests} לא מחוברים (בלי מחירים)` : "")
    + (failed ? ` · ${failed} עם שגיאה (פרטים במעבר עכבר)` : "");
  renderFacets(j.facets);
  if (j.price_range) {
    $("#pmin").placeholder = "מ-" + Math.floor(j.price_range[0]);
    $("#pmax").placeholder = "עד " + Math.ceil(j.price_range[1]);
  }
  const res = $("#results");
  if (state.view === "compare") {
    if (!j.groups.length) { res.innerHTML = `<div class="card empty">אין תוצאות התואמות לסינון.</div>`; return; }
    res.innerHTML = j.groups.map(g => {
      const best = state.basis === "ex" ? Math.min(...g.offers.map(o => o.price_ex_vat ?? Infinity)) : g.best_price;
      return `<div class="card group">
        <div class="head">${img(g.image)}
          <div><div class="title">${esc(g.title)}</div>
            <div class="meta">${g.mpn ? `<span>מק"ט יצרן: ${esc(g.mpn)}</span>` : ""}<span>${g.offers.length} הצעות מ-${g.sites} ספקים</span></div></div>
          <div class="price"><small>הזול ביותר</small><b>${money(Number.isFinite(best) ? best : null)}</b></div>
        </div>
        <table class="offers">${g.offers.map((o, i) => `<tr class="${i === 0 && g.sites > 1 ? "best" : ""}">
          <td><b>${esc(o.site_name)}</b></td>
          <td><a class="title" href="${esc(safeUrl(o.url))}" target="_blank" rel="noopener">${esc(o.title)}</a></td>
          <td>${stockTag(o)}</td><td class="price">${priceBlock(o)}<br>${quoteBtn(o)}</td></tr>`).join("")}</table>
      </div>`;
    }).join("");
    return;
  }
  if (!j.items.length) { res.innerHTML = `<div class="card empty">אין תוצאות התואמות לסינון.</div>`; return; }
  res.innerHTML = `<div class="card">` + j.items.map(p => `<div class="item">${img(p.image)}
      <div><a class="title" href="${esc(safeUrl(p.url))}" target="_blank" rel="noopener">${esc(p.title)}</a>
        <div class="meta"><span class="tag">${esc(p.site_name)}</span>${stockTag(p)}
          ${p.brand ? `<span>${esc(p.brand)}</span>` : ""}
          ${p.mpn ? `<span>מק"ט יצרן: ${esc(p.mpn)}</span>` : ""}
          ${p.sku ? `<span>מק"ט: ${esc(p.sku)}</span>` : ""}
          ${p.category ? `<span>${esc(p.category)}</span>` : ""}
          ${p.deep_specs && p.deep_specs.length ? `<span class="tag" title="נקרא מדף המוצר בחיפוש מעמיק">מפרט מדף המוצר</span>` : ""}</div></div>
      <div class="price">${priceBlock(p)}<br>${quoteBtn(p)}</div></div>`).join("") + `</div>`;
}

const FACET_LIMIT = 8;
function renderFacets(facets) {
  $("#facets").innerHTML = facets.map(f => {
    const open = state.expanded.has(f.key);
    const vals = open ? f.values : f.values.slice(0, FACET_LIMIT);
    return `<div class="facet"><h3>${esc(f.label)}</h3>${vals.map(v =>
      `<label><input type="checkbox" data-facet="${esc(f.key)}" value="${esc(v.value)}" ${v.selected ? "checked" : ""}> ${esc(v.value)}<span class="n">${v.count}</span></label>`).join("")}
      ${f.values.length > FACET_LIMIT ? `<button type="button" class="more" data-more="${esc(f.key)}">${open ? "פחות" : `עוד ${f.values.length - FACET_LIMIT}`}</button>` : ""}</div>`;
  }).join("");
}

$("#facets").addEventListener("change", e => {
  const key = e.target.dataset.facet; if (!key) return;
  const set = new Set(state.facets[key] || []);
  e.target.checked ? set.add(e.target.value) : set.delete(e.target.value);
  state.facets[key] = [...set];
  if (!set.size) delete state.facets[key];
  run(false);
});
$("#facets").addEventListener("click", e => {
  const key = e.target.dataset.more; if (!key) return;
  state.expanded.has(key) ? state.expanded.delete(key) : state.expanded.add(key);
  run(false);
});

let timer;
function debounced() { clearTimeout(timer); timer = setTimeout(() => run(false), 400); }
["#pmin", "#pmax", "#include", "#exclude"].forEach(id => $(id).addEventListener("input", debounced));
["#instock", "#hasprice", "#relevant", "#sort", "#deep", "#source"].forEach(id => $(id).addEventListener("change", () => run(false)));
$("#source").addEventListener("change", () => { savePrefs(); state.lastQuery = ""; });
$("#clear").addEventListener("click", () => {
  state.facets = {};
  ["#pmin", "#pmax", "#include", "#exclude"].forEach(id => $(id).value = "");
  ["#instock", "#hasprice", "#relevant"].forEach(id => $(id).checked = false);
  run(false);
});
$("#filtersToggle").addEventListener("click", () => $("#filters").classList.toggle("open"));
$("#form").addEventListener("submit", e => {
  e.preventDefault();
  if ($("#q").value.trim() !== state.lastQuery) state.facets = {};
  run($("#refresh").checked);
});

async function loadInfo() {
  try {
    const j = await api("api/info");
    if (j.ai) {
      const a = document.createElement("a");
      a.href = "ai"; a.textContent = "חיפוש AI"; a.title = "תיאור או קוד מוצר - ה-AI ימצא את הדומה ביותר במלאי";
      $("#userbar").prepend(a);
    }
    const el = $("#egress");
    if (j.egress === "office") {
      el.textContent = "יוצא דרך המשרד"; el.className = "chip ok"; el.title = "Tailscale exit node: " + j.egress_detail;
      el.hidden = false;
    } else if (j.egress_detail === "tailscale-failed") {
      el.textContent = "Tailscale לא מחובר - יוצא ישירות"; el.className = "chip err";
      el.title = "בדוק את TS_AUTHKEY ו-TS_EXIT_NODE ב-Fly"; el.hidden = false;
    }
  } catch (e) {}
}

// -- price quote dialog --------------------------------------------------------------
let quoteSettings = null, quoteProduct = null;
const r2 = (v) => Math.round(v * 100) / 100;
function quoteTotals() {
  const qty = Number($("#qQty").value) || 0, unit = Number($("#qPrice").value) || 0;
  const sub = r2(qty * unit), vat = r2(sub * 0.18);
  $("#qTotals").innerHTML = `לפני מע"מ: <b>${money(sub)}</b> · מע"מ: ${money(vat)} · סה"כ: <b>${money(r2(sub + vat))}</b>`;
}
function priceFromMarkup() {
  const cost = quoteProduct.price_ex_vat;
  if (cost != null) $("#qPrice").value = r2(cost * (1 + (Number($("#qMarkup").value) || 0) / 100));
  quoteTotals();
}
$("#results").addEventListener("click", async e => {
  const i = e.target.dataset.quote; if (i === undefined) return;
  quoteProduct = state.quoteItems[Number(i)];
  if (!quoteSettings) { try { quoteSettings = await api("api/quote/settings"); } catch (ex) { quoteSettings = { markup_percent: 15 }; } }
  $("#qTitle").textContent = quoteProduct.title;
  $("#qMarkup").value = quoteSettings.markup_percent;
  $("#qQty").value = 1;
  $("#qCost").textContent = quoteProduct.price_ex_vat != null
    ? `עלות אצל ${quoteProduct.site_name}: ${money(quoteProduct.price_ex_vat)} לפני מע"מ`
    : "אין מחיר עלות (הספק לא מחובר) - יש להזין מחיר ליחידה";
  $("#qPrice").value = "";
  priceFromMarkup();
  $("#quoteDlg").showModal();
});
$("#qMarkup").addEventListener("input", priceFromMarkup);
["#qQty", "#qPrice"].forEach(id => $(id).addEventListener("input", quoteTotals));
$("#qCancel").onclick = () => $("#quoteDlg").close();
$("#quoteForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("#qGo"); btn.disabled = true; btn.textContent = "מכין PDF…";
  try {
    const r = await fetch("api/quote/pdf", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ customer: $("#qCustomer").value, customer_contact: $("#qContact").value,
        notes: $("#qNotes").value, show_images: $("#qImage").checked,
        items: [{ title: quoteProduct.title, mpn: quoteProduct.mpn || "", image: quoteProduct.image || "",
                  qty: Number($("#qQty").value), unit_price: Number($("#qPrice").value) }] }) });
    if (r.status === 401) { location.href = "login"; return; }
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.detail ? (typeof j.detail === "string" ? j.detail : "יש לבדוק את השדות") : r.statusText); }
    const name = (r.headers.get("Content-Disposition") || "").match(/filename="([^"]+)"/);
    const url = URL.createObjectURL(await r.blob());
    const a = Object.assign(document.createElement("a"), { href: url, download: name ? name[1] : "quote.pdf" });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    $("#quoteDlg").close();
  } catch (ex) {
    alert(ex.message);
  } finally {
    btn.disabled = false; btn.textContent = "הורדת PDF";
  }
});

loadPrefs();
const meReady = loadMe().catch(() => {});
meReady.then(loadInfo);  // the AI link goes into the user bar loadMe draws
segment("#basis", "basis");
segment("#view", "view");
Promise.all([meReady, loadSites()]).then(() => {
  // every visit starts with the user's favourite suppliers selected
  if (state.favorites && state.favorites.size) pickFavorites();
  renderSites(null);
  const m = location.hash.match(/q=([^&]+)/);
  if (m) { $("#q").value = decodeURIComponent(m[1]); run(false); }
});
</script>
</body>
</html>
