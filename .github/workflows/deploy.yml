name: test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_ORG: ${{ vars.FLY_ORG || 'personal' }}
    steps:
      - uses: actions/checkout@v5

      - name: Fly not connected yet
        if: env.FLY_API_TOKEN == ''
        run: echo "::warning::Add the FLY_API_TOKEN repository secret to deploy to Fly.io"

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''

      - name: Create the app and its volume on the first deploy
        if: env.FLY_API_TOKEN != ''
        run: |
          APP=$(sed -n 's/^app = "\(.*\)"/\1/p' fly.toml)
          REGION=$(sed -n 's/^primary_region = "\(.*\)"/\1/p' fly.toml)
          flyctl status -a "$APP" >/dev/null 2>&1 || flyctl apps create "$APP" --org "$FLY_ORG"
          flyctl volumes list -a "$APP" | grep -q supsearch_data \
            || flyctl volumes create supsearch_data -a "$APP" -r "$REGION" -s 1 -y

      - name: Copy secrets to Fly
        if: env.FLY_API_TOKEN != ''
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          SUPPLIER_CREDENTIALS: ${{ secrets.SUPPLIER_CREDENTIALS }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TS_EXIT_NODE: ${{ secrets.TS_EXIT_NODE }}
        run: |
          APP=$(sed -n 's/^app = "\(.*\)"/\1/p' fly.toml)
          args=()
          for name in APP_PASSWORD SUPPLIER_CREDENTIALS TS_AUTHKEY TS_EXIT_NODE; do
            value=$(printenv "$name" || true)
            [ -n "$value" ] && args+=("$name=$value")
          done
          # the key that encrypts the saved supplier passwords: made once, kept forever
          # (a new key would make the admin re-enter every supplier password)
          if ! flyctl secrets list -a "$APP" --json | grep -q '"SECRET_KEY"'; then
            args+=("SECRET_KEY=$(openssl rand -hex 32)")
          fi
          if [ ${#args[@]} -gt 0 ]; then flyctl secrets set --stage -a "$APP" "${args[@]}"; fi

      - name: Deploy
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only
